function fmtMillones(v) {
  if (v === null || v === undefined) return "--";
  return "$" + (v / 1e6).toLocaleString("es-AR", {maximumFractionDigits: 1}) + "M";
}
function fmtPct(v) {
  if (v === null || v === undefined) return "--";
  return v.toLocaleString("es-AR", {maximumFractionDigits: 1}) + "%";
}
function fmtInt(v) {
  if (v === null || v === undefined) return "--";
  return Math.round(v).toLocaleString("es-AR");
}
function fmtMoneda(v) {
  if (v === null || v === undefined) return "--";
  return "$" + Math.round(v).toLocaleString("es-AR");
}

function sugMax(...vals) {

}

  }
  if (tab.pagos_lapsos) {
    document.getElementById(`pagosNoPago-${idx}`).innerHTML = pagosLapsosModuloHtml(idx, "no_pago_2m", tab.pagos_lapsos.no_pago_2m, tab.pagos_lapsos);
    document.getElementById(`pagosDejaron-${idx}`).innerHTML = pagosLapsosModuloHtml(idx, "dejaron_pagar", tab.pagos_lapsos.dejaron_pagar, tab.pagos_lapsos);
  }
  chartInstances[`fc-${idx}`] = new Chart(document.getElementById(`chartFactCobr-${idx}`), {
    type: "bar",
    data: {
      labels: ["Mes Anterior", "Mes Actual (parcial)"],
      datasets: [
        { label: "Facturado", data: [tab.facturado.anterior, tab.facturado.actual], backgroundColor: "#1F4E78" },
        { label: "Cobrado", data: [tab.cobrado.anterior, tab.cobrado.actual], backgroundColor: "#70AD47" },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: "bottom" },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmtMillones(c.raw)}` } } },
      scales: {
        x: { ticks: { maxRotation: 0, minRotation: 0 } },
        y: { suggestedMax: sugMax(tab.facturado.anterior, tab.facturado.actual, tab.cobrado.anterior, tab.cobrado.actual),
              ticks: { callback: fmtMillones } }
      }
    }
  });

  const contSrv = document.getElementById(`chartsServicio-${idx}`);
  contSrv.innerHTML = "";
  tab.altas_bajas.forEach((s, i) => {
    const nota = s.inferido
      ? `<div class="nota">Inferido de facturación (ítems "Dibox"), no de contrato -- no existe como
         producto/contrato propio en el CRM.</div>`
      : "";
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="card"><div style="font-weight:600;margin-bottom:8px;">${s.servicio}</div><canvas id="chartSrv-${idx}-${i}"></canvas>${nota}</div>`;
    contSrv.appendChild(wrap);
    chartInstances[`srv-${idx}-${i}`] = new Chart(wrap.querySelector("canvas"), {
      type: "bar",
      data: {
        labels: ["Mes Anterior", "Mes Actual"],
        datasets: [
          { label: "Altas", data: [s.altas_anterior, s.altas_actual], backgroundColor: "#70AD47" },
          { label: "Bajas", data: [s.bajas_anterior, s.bajas_actual], backgroundColor: "#C0392B" },
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: "bottom" } },
        scales: {
          x: { ticks: { maxRotation: 0, minRotation: 0 } },
          y: { suggestedMax: sugMax(s.altas_anterior, s.altas_actual, s.bajas_anterior, s.bajas_actual),
                ticks: { precision: 0 } }
        }
      }
    });
  });

  chartInstances[`pend-${idx}`] = new Chart(document.getElementById(`chartPendientes-${idx}`), {
    type: "bar",
    data: {
      labels: tab.pendientes.map(p => p.servicio),
      datasets: [{ label: "Instalaciones Pendientes", data: tab.pendientes.map(p => p.cantidad), backgroundColor: "#1F4E78" }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { maxRotation: 0, minRotation: 0 } },
        y: { suggestedMax: sugMax(...tab.pendientes.map(p => p.cantidad)), ticks: { precision: 0 } }
      }
    }
  });

  chartInstances[`activos-${idx}`] = new Chart(document.getElementById(`chartActivos-${idx}`), {
    type: "bar",
    data: {
      labels: tab.activos.map(a => a.servicio),
      datasets: [{ label: "Contratos Activos", data: tab.activos.map(a => a.cantidad), backgroundColor: "#1F4E78" }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { maxRotation: 0, minRotation: 0 } },
        y: { suggestedMax: sugMax(...tab.activos.map(a => a.cantidad)), ticks: { precision: 0 } }
      }
    }
  });

  if (tab.medios_cobro) {
    const mc = tab.medios_cobro;
    chartInstances[`mediocobro-${idx}`] = new Chart(document.getElementById(`chartMediosCobro-${idx}`), {
      type: "doughnut",
      data: {
        labels: mc.segmentos.map(s => s.medio),
        datasets: [{ data: mc.segmentos.map(s => s.monto),
          backgroundColor: mc.segmentos.map((s, i) => DONUT_COLORS[i % DONUT_COLORS.length]) }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: "right" },
          tooltip: { callbacks: { label: c => `${c.label}: ${fmtMillones(c.raw)} (${mc.segmentos[c.dataIndex].pct}%)` } }
        }
      }
    });
  }
}

function saldoClientesHtml(s) {
  const kpis = [
    ["Saldo inicial de clientes (1er día del mes)", fmtInt(s.saldo_inicial)],
    ["Altas (mes, acumulado)", fmtInt(s.altas)],
    ["Recupero (mes, acumulado)", fmtInt(s.recupero)],
    ["Bajas voluntarias (mes, acumulado)", fmtInt(s.bajas_vol)],
    ["Bajas por mora (mes, acumulado)", fmtInt(s.bajas_mora)],
  ];
  if (s.migracion) kpis.push(["Migración (mes, acumulado)", fmtInt(s.migracion)]);
  kpis.push(["Saldo final de clientes (activos a hoy)", fmtInt(s.saldo_final)]);
  return kpis.map(([label, valor]) =>
    `<div class="kpi"><div class="label">${label}</div><div class="valor">${valor}</div></div>`
  ).join("");
}

function pagosLapsosModuloHtml(idx, bloque, b, pl) {
  return `
    <div class="valor" style="font-size:1.8rem;">${fmtInt(b.cantidad)}</div>
    <div class="sub">${b.pct.toFixed(1)}% de los clientes activos (${pl.mes_anterior} / ${pl.mes_actual})</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
      <button type="button" class="btn-descarga" onclick="descargarPagosLapsos(${idx}, '${bloque}', 'xlsx')"
        ${b.cantidad ? "" : "disabled"}>Descargar Excel</button>
      <button type="button" class="btn-descarga" onclick="descargarPagosLapsos(${idx}, '${bloque}', 'pdf')"
        ${b.cantidad ? "" : "disabled"}>Descargar PDF</button>
    </div>
  `;
}

function descargarXlsx(filename, rows, headers, headerLabels) {
  const aoa = [headerLabels].concat(rows.map(r => headers.map(h => r[h] ?? "")));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = headers.map(() => ({ wch: 20 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Listado");
  XLSX.writeFile(wb, filename);
}

function descargarPdf(filename, titulo, rows, headers, headerLabels) {
  const doc = new jspdf.jsPDF({ orientation: "landscape" });
  doc.setFontSize(12);
  doc.text(titulo, 14, 14);
  doc.autoTable({
    startY: 20, head: [headerLabels],
    body: rows.map(r => headers.map(h => r[h] ?? "")),
    styles: { fontSize: 8 }, headStyles: { fillColor: [31, 78, 120] },
  });
  doc.save(filename);
}

function descargarPagosLapsos(idx, bloque, formato) {
  const tab = DATA.tabs[idx];
  const pl = tab && tab.pagos_lapsos;
  if (!pl) return;
  const b = pl[bloque];
  const tituloBloque = bloque === "no_pago_2m" ? "Sin pago 2 meses" : "Dejaron de pagar";
  const titulo = `${tab.label} - ${tituloBloque} (${pl.mes_actual})`;
  const headers = ["empresa", "cliente_id", "nombre", "documento", "direccion", "telefono"];
  const headerLabels = ["Empresa", "Cliente ID", "Nombre", "Documento", "Dirección", "Teléfono"];
  if (formato === "pdf") {
    descargarPdf(`${titulo}.pdf`, titulo, b.clientes, headers, headerLabels);
  } else {
    descargarXlsx(`${titulo}.xlsx`, b.clientes, headers, headerLabels);
  }
}

function kpisHtml(tab) {
  const pctCobr = tab.facturado.actual ? (tab.cobrado.actual / tab.facturado.actual) * 100 : null;
  const totalPend = tab.pendientes.reduce((s, p) => s + p.cantidad, 0);
  const kpis = [
    ["Facturado (mes actual)", fmtMillones(tab.facturado.actual)],
  ];
  if (tab.cache_hasta && tab.cobrado_comparativa) {
    const dhLabel = n => n === 1 ? "1 día hábil transcurrido" : `${n} días hábiles transcurridos`;
    const c = tab.cobrado_comparativa;
    kpis.push([`Cobrado (mes actual, al ${c.fecha_actual}) — ${dhLabel(c.dias_habiles_actual)}`,
                fmtMillones(tab.cobrado.actual)]);
    kpis.push([`Cobrado (mes anterior, al mismo día ${c.fecha_anterior}) — ${dhLabel(c.dias_habiles_anterior)}`,
                fmtMillones(c.cobr_anterior)]);
  } else {
    kpis.push(["Cobrado (mes actual, parcial)", fmtMillones(tab.cobrado.actual)]);
  }
  kpis.push(["ARPU residencial (mes)", fmtMoneda(tab.arpu_residencial)]);
  kpis.push(["Churn residencial (mes)", fmtPct(tab.churn_residencial)]);
  kpis.push(["% Cobranza sobre Facturado", fmtPct(pctCobr)]);
  kpis.push(["Instalaciones Pendientes (total)", fmtInt(totalPend)]);
  return kpis.map(([label, valor]) =>
    `<div class="kpi"><div class="label">${label}</div><div class="valor">${valor}</div></div>`
  ).join("");
}

const nav = document.getElementById("tabNav");
const panels = document.getElementById("tabPanels");
const initialized = {};

DATA.tabs.forEach((tab, idx) => {
  const btn = document.createElement("button");
  btn.textContent = tab.label;
  btn.addEventListener("click", () => showTab(idx));
  nav.appendChild(btn);

  const panel = document.createElement("div");
  panel.id = `panel-${idx}`;
  panel.style.display = "none";
  panel.innerHTML = panelHtml(tab, idx);
  panels.appendChild(panel);
});

function showTab(idx) {
  Array.from(nav.children).forEach((b, i) => b.classList.toggle("active", i === idx));
  Array.from(panels.children).forEach((p, i) => p.style.display = i === idx ? "" : "none");
  if (!initialized[idx]) {
    renderPanelCharts(DATA.tabs[idx], idx);
    initialized[idx] = true;
  }
}

showTab(0);
</script>
<script>
// Auto-reload cuando hay una build mas nueva publicada -- el dashboard se comparte como link
// (y como icono "agregar a inicio" en celulares) a las 10 franquicias, no podemos depender de que
// alguien fuerce un refresh manual. Re-descarga este mismo HTML con cache:'no-store' cada 90s
// mientras la pestana esta visible, y ademas al volver a primer plano (cubre el caso del icono de
// pantalla de inicio que reusa el mismo WebView), y compara el generated_at embebido via regex
// (evita crear un archivo aparte para no duplicar la fuente de verdad).
(function() {
  var CHECK_MS = 90000;
  var RE_GENERATED_AT = /"generated_at":\s*"([^"]+)"/;
  function checkVersion() {
    if (document.hidden) return;
    fetch(location.pathname + "?_=" + Date.now(), {cache: "no-store"})
      .then(function(r) { return r.text(); })
      .then(function(html) {
        var m = html.match(RE_GENERATED_AT);
        if (m && m[1] !== DATA.generated_at) {
          console.log("Dashboard: nueva version detectada (" + DATA.generated_at + " -> " + m[1] + "), recargando...");
          location.reload();
        }
      })
      .catch(function(e) { /* sin conexion -- no hacer nada */ });
  }
  setInterval(checkVersion, CHECK_MS);
  document.addEventListener("visibilitychange", function() { if (!document.hidden) checkVersion(); });
})();
</script>
